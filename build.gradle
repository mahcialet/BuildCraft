plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
}

group = 'com.mod-buildcraft'
version = mod_version

base {
    archivesName = 'buildcraft'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    // The 1.12 tests remain in src/test/java as migration references. Modernized
    // tests move here as their corresponding production code is ported.
    test {
        java.setSrcDirs(['src/test-neoforge/java'])
        resources.setSrcDirs(['src/test-neoforge/resources'])
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            programArgument '--tests'
            programArgument 'buildcraftcore:*'
            programArgument '--report'
            programArgument file('build/test-results/gametest/results.xml').absolutePath
        }
    }

    mods {
        buildcraftcore {
            sourceSet sourceSets.main
        }
        buildcraftenergy {
            sourceSet sourceSets.main
        }
        buildcrafttransport {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll('-Xlint:deprecation')
}

tasks.named('processResources', ProcessResources) {
    // Reuse the original artwork without duplicating binary assets while the
    // historical resource tree remains available as the migration source.
    from('buildcraft_resources/assets/buildcraftcore/textures/items') {
        include 'gear_wood.png', 'gear_stone.png', 'gear_iron.png', 'gear_gold.png', 'gear_diamond.png', 'diamond_shard.png', 'wrench.png', 'marker_path.png', 'marker_volume.png', 'marker_connector.png', 'fragile_fluid_shard_base.png', 'fragile_fluid_shard_fluid.png'
        into 'assets/buildcraftcore/textures/item'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/items/map') {
        into 'assets/buildcraftcore/textures/item/map'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/items/paintbrush') {
        into 'assets/buildcraftcore/textures/item/paintbrush'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/items/list') {
        into 'assets/buildcraftcore/textures/item/list'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/gui') {
        include 'list_new.png'
        into 'assets/buildcraftcore/textures/gui'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/lasers') {
        include 'marker_volume_connected.png'
        into 'assets/buildcraftcore/textures/block/lasers'
    }
    from('buildcraft_resources/assets/buildcraftcore/models/item') {
        include 'volume_box.json'
        filter { line -> line.replace(
            '"main": "buildcraftcore:lasers/marker_volume_connected"',
            '"main": "buildcraftcore:block/lasers/marker_volume_connected", "particle": "buildcraftcore:block/lasers/marker_volume_connected"'
        ) }
        into 'assets/buildcraftcore/models/item'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/blocks') {
        include 'marker_path.png', 'marker_volume.png'
        into 'assets/buildcraftcore/textures/block'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/blocks/engine/wood') {
        into 'assets/buildcraftcore/textures/block/engine/wood'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/blocks/engine/creative') {
        into 'assets/buildcraftcore/textures/block/engine/creative'
    }
    from('buildcraft_resources/assets/buildcraftlib/textures/blocks/engine') {
        include 'chamber_base.png', 'trunk_blue.png', 'trunk_green.png', 'trunk_yellow.png', 'trunk_red.png', 'trunk_overheat.png'
        into 'assets/buildcraftcore/textures/block/engine'
    }
    from('buildcraft_resources/assets/buildcraftcore/textures/blocks/blueprint') {
        include 'black.png', 'blue.png'
        into 'assets/buildcraftcore/textures/block/blueprint'
    }
    from('buildcraft_resources/assets/buildcraftenergy/textures/blocks/fluids') {
        include 'oil_heat_0_still.png', 'oil_heat_0_still.png.mcmeta',
            'oil_heat_0_flow.png', 'oil_heat_0_flow.png.mcmeta',
            'fuel_still.png', 'fuel_still.png.mcmeta', 'fuel_flow.png', 'fuel_flow.png.mcmeta'
        into 'assets/buildcraftenergy/textures/block/fluids'
    }
    from('buildcraft_resources/assets/buildcraftenergy/textures/items') {
        include 'bucketOil.png', 'bucketFuel.png'
        rename 'bucketOil.png', 'oil_bucket.png'
        rename 'bucketFuel.png', 'fuel_light_bucket.png'
        into 'assets/buildcraftenergy/textures/item'
    }
    from('buildcraft_resources/assets/buildcraftenergy/textures/blocks/engine/stone') {
        include 'back.png', 'side.png'
        into 'assets/buildcraftenergy/textures/block/engine/stone'
    }
    from('buildcraft_resources/assets/buildcraftenergy/textures/blocks/engine/iron') {
        include 'back.png', 'side.png'
        into 'assets/buildcraftenergy/textures/block/engine/iron'
    }
    from('buildcraft_resources/assets/buildcraftenergy/textures/blocks/engine/rf') {
        include 'back.png', 'side.png'
        into 'assets/buildcraftenergy/textures/block/engine/rf'
    }

    from('buildcraft_resources/assets/buildcraftenergy/textures/blocks/mj_dynamo') {
        include 'back.png', 'front.png', 'side.png'
        into 'assets/buildcraftenergy/textures/block/mj_dynamo'
    }

        from('buildcraft_resources/assets/buildcrafttransport/textures/pipes') {
        include 'structure.png', 'cobblestone_item.png', 'stone_item.png', 'quartz_item.png',
            'wood_item_clear.png', 'wood_item_filled.png', 'gold_item.png',
            'iron_item_clear.png', 'iron_item_filled.png', 'clay_item.png',
            'sandstone_item.png', 'void_item.png', 'obsidian_item.png', 'lapis_item_base.png',
            'lapis_item_black.png', 'lapis_item_blue.png', 'lapis_item_brown.png', 'lapis_item_cyan.png',
            'lapis_item_gray.png', 'lapis_item_green.png', 'lapis_item_light_blue.png', 'lapis_item_lime.png',
            'lapis_item_magenta.png', 'lapis_item_orange.png', 'lapis_item_pink.png', 'lapis_item_purple.png',
            'lapis_item_red.png', 'lapis_item_silver.png', 'lapis_item_white.png', 'lapis_item_yellow.png',
            'daizuli_item_black.png', 'daizuli_item_blue.png', 'daizuli_item_brown.png', 'daizuli_item_cyan.png',
            'daizuli_item_filled.png', 'daizuli_item_gray.png', 'daizuli_item_green.png',
            'daizuli_item_light_blue.png', 'daizuli_item_lime.png', 'daizuli_item_magenta.png',
            'daizuli_item_orange.png', 'daizuli_item_pink.png', 'daizuli_item_purple.png',
            'daizuli_item_red.png', 'daizuli_item_silver.png', 'daizuli_item_white.png', 'daizuli_item_yellow.png',
            'diamond_wood_item_clear.png', 'diamond_wood_item_filled.png',
            'emzuli_item_clear.png', 'emzuli_item_filled.png', 'diamond_item.png',
            'diamond_item_down.png', 'diamond_item_up.png', 'diamond_item_north.png',
            'diamond_item_south.png', 'diamond_item_west.png', 'diamond_item_east.png',
            'diamond_item_itemstack.png', 'stripes_item.png', 'cobblestone_fluid.png',
            'stone_fluid.png', 'quartz_fluid.png', 'wood_fluid_clear.png', 'wood_fluid_filled.png',
            'gold_fluid.png', 'sandstone_fluid.png', 'iron_fluid_clear.png', 'iron_fluid_filled.png',
            'clay_fluid.png', 'void_fluid.png', 'diamond_fluid.png', 'diamond_fluid_down.png',
            'diamond_fluid_up.png', 'diamond_fluid_north.png', 'diamond_fluid_south.png',
            'diamond_fluid_west.png', 'diamond_fluid_east.png', 'diamond_fluid_itemstack.png',
            'diamond_wood_fluid_clear.png', 'diamond_wood_fluid_filled.png'
            into 'assets/buildcrafttransport/textures/block/pipe'
        }
        from('buildcraft_resources/assets/buildcrafttransport/textures/gui') {
            include 'filter.png'
            into 'assets/buildcrafttransport/textures/gui'
        }
    from('buildcraft_resources/assets/buildcraftcore/textures/blocks/misc') {
        include 'leather.png', 'paper.png', 'texture_red_dark.png'
        into 'assets/buildcraftcore/textures/block/misc'
    }
    from('buildcraft_resources/assets/buildcraftsilicon/textures/blocks/laser') {
        include 'bottom.png'
        into 'assets/buildcraftcore/textures/block/laser'
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Implementation-Title': 'BuildCraft',
            'Implementation-Version': project.version
        )
    }
}

def gameTestResultsDirectory = layout.buildDirectory.dir('test-results/gametest')

tasks.named('runGameTestServer').configure {
    doFirst {
        gameTestResultsDirectory.get().asFile.mkdirs()
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('runGameTestServer')
}
