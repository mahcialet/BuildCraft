plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.142'
}

group = 'com.mod-buildcraft'
version = mod_version

base {
    archivesName = 'buildcraft'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    // The 1.12 tests remain in src/test/java as migration references. Modernized
    // tests move here as their corresponding production code is ported.
    test {
        java.setSrcDirs(['src/test-neoforge/java'])
        resources.setSrcDirs(['src/test-neoforge/resources'])
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        buildcraft {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
            'Implementation-Title': 'BuildCraft',
            'Implementation-Version': project.version
        )
    }
}
